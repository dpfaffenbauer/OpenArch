# The share relay as a Cloudflare Worker (see README.md).
name = "openarch-share-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The address OpenArch uses by default; Cloudflare makes its DNS record and
# certificate. For a relay of your own, put your domain here or remove this.
routes = [{ pattern = "share.openarch.app", custom_domain = true }]

# Where the envelopes live: the namespace "openarch-shares" in OpenArch's
# Cloudflare account. For a relay of your own, make a namespace and put its id
# here: npx wrangler@3 kv namespace create SHARES
[[kv_namespaces]]
binding = "SHARES"
id = "8feafc402f974571acfe0df11ae669da"
