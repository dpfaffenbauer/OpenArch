name: Build

on:
  push:
    branches: [main]
    # v0.1.0 and so on: builds that version and publishes a release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew list ninja >/dev/null 2>&1 || brew install ninja

      # CEF (~350 MB) and its wrapper library only change with the pinned
      # version or the patch.
      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: Vendor/cef
          key: cef-${{ runner.arch }}-${{ hashFiles('scripts/fetch-cef.sh', 'scripts/patch-cef.*') }}

      - name: Build OpenArch.app
        env:
          OPENARCH_BUILD: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export OPENARCH_VERSION="${GITHUB_REF_NAME#v}"; fi
          CONFIG=release App/build.sh

      # Drives the real UI in the background. Needs network access (it opens
      # example.com and friends); reported, but not yet allowed to fail the
      # build while it proves itself on hosted runners.
      - name: Self-test
        continue-on-error: true
        run: |
          App/build/OpenArch.app/Contents/MacOS/OpenArch --selftest > selftest.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep "\[selftest\]" selftest.log || true
          grep -q "DONE failures=0" selftest.log

      - name: Package
        run: ditto -c -k --keepParent App/build/OpenArch.app OpenArch.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenArch
          path: OpenArch.zip
          retention-days: 14

      # The newest build of main, for downloading without building.
      - name: Update the "nightly" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cef="$(cat Vendor/cef/.version)"
          notes="Build of $(git rev-parse --short HEAD) with CEF $cef. Unsigned: after downloading, run
          xattr -dr com.apple.quarantine OpenArch.app"
          # What OpenArch's updater reads; uploaded after the zip it points to.
          cat > latest.json <<JSON
          {"build": ${{ github.run_number }}, "commit": "$(git rev-parse --short HEAD)", "chromium": "$cef",
           "sha256": "$(shasum -a 256 OpenArch.zip | cut -d' ' -f1)", "size": $(stat -f%z OpenArch.zip),
           "url": "https://github.com/${{ github.repository }}/releases/download/nightly/OpenArch.zip"}
          JSON
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly OpenArch.zip --clobber
            gh release edit nightly --notes "$notes"
          else
            gh release create nightly OpenArch.zip --prerelease --title "OpenArch Nightly" --notes "$notes"
          fi
          gh release upload nightly latest.json --clobber

      # A version tag: the release, with notes from .github/release-notes.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=/dev/null
          # Same file name in every release: releases/latest/download/OpenArch.zip
          # always points to the newest one.
          gh release create "$GITHUB_REF_NAME" OpenArch.zip --title "OpenArch $version" --notes-file "$notes" --verify-tag
