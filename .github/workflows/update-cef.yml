name: Update Chromium

# Every day: if a newer stable CEF (Chromium) build exists, build OpenArch
# with it and, when that works, commit the update and publish a new nightly.
# A failing build stops here and GitHub reports the failed run.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Look for a newer CEF
        id: cef
        run: scripts/update-cef.sh

      - name: Build with it
        if: steps.cef.outputs.updated == 'true'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          CONFIG=release App/build.sh

      - name: Commit the update to main
        if: steps.cef.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cef.outputs.version }}
          PREVIOUS: ${{ steps.cef.outputs.previous }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update CEF to $VERSION" -m "Automatic update from CEF $PREVIOUS. OpenArch built successfully with it."
          git push origin HEAD:main
          # Pushes made with this token do not start workflows, so start the
          # build of main (and its nightly release) explicitly.
          gh workflow run build.yml --ref main
