    steps: *resume

  build-19:
    name: Build 19
    needs: build-18
    if: needs.build-18.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "19", PREVIOUS: "18" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-20:
    name: Build 20
    needs: build-19
    if: needs.build-19.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "20", PREVIOUS: "19" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  publish:
    name: Publish the release
    needs: [build-01, build-02, build-03, build-04, build-05, build-06, build-07, build-08, build-09, build-10, build-11, build-12, build-13, build-14, build-15, build-16, build-17, build-18, build-19, build-20]
    # Runs when one build job finished and none failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.*.outputs.status, 'finished') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      actions: write # deleting the intermediate artifacts
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: engine-distrib
          path: ${{ runner.temp }}/engine-distrib

      - name: Create or update the release
        env:
          GH_REPO: ${{ github.repository }}
        run: scripts/chromium-engine-ci.sh publish

      - name: Delete the remaining build trees
        run: scripts/chromium-engine-ci.sh drop-artifacts engine-state-
