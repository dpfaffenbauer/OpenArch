name: Chromium engine
run-name: Chromium engine ${{ inputs.chromium_version || 'as pinned' }} (${{ github.ref_name }})

# Builds OpenArch's engine (docs/chromium-engine.md): Chrome's own framework
# from the stable tag in engine/chromium/VERSION with OpenArch's layer
# (engine/chromium), an official macOS arm64 build with H.264/AAC, and
# publishes Chromium.app zipped, with its SHA-256, as the pre-release
# engine-<version>-<key>. The key is a hash of the layer, its hooks, the
# bridge's headers and the build scripts (scripts/fetch-chromium-engine.sh
# --key), so every change to them gets its own build, and
# OPENARCH_ENGINE=chromium App/build.sh downloads the one that fits.
#
# As for CEF (cef-codecs.yml), Chromium takes two to three days on a hosted
# macOS runner and a job may run for six hours: a chain of jobs, each one
# builds for about five hours, packs the tree into an artifact, and the next
# one lets ninja carry on. The job that finishes zips the app; the jobs after
# it are skipped. The work itself is in scripts/chromium-engine-ci.sh.
#
# Starts on a push to main that changes what the engine is built from, from
# scripts/update-chromium.sh when Chrome has a new stable version, or by
# hand: Actions > Chromium engine > Run workflow. When the release for the
# version and key is already there, nothing is built. A failed job (a lost
# runner, a network error) can be re-run with "Re-run failed jobs".

on:
  push:
    branches: [main]
    paths:
      - engine/chromium/**
      - App/Sources/OpenArchCore/include/**
      - scripts/build-chromium.sh
      - scripts/chromium-engine-ci.sh
  workflow_dispatch:
    inputs:
      chromium_version:
        description: Chrome version; empty = engine/chromium/VERSION
        default: ""
      gn_args:
        description: GN args added to, and overriding, those of scripts/build-chromium.sh
        default: ""
      runner:
        description: Runner (macOS on Apple silicon)
        default: macos-26

# The build jobs run Chromium's toolchains and hooks for hours, so they only
# read the repository and delete this run's artifacts; only the publish job
# writes the release. The token goes only to the steps that call gh.
permissions:
  contents: read
  actions: write # deleting the intermediate artifacts

# One engine build at a time; a newer push waits instead of cancelling a
# build that is a day in.
concurrency:
  group: chromium-engine
  cancel-in-progress: false

env:
  CHROMIUM_VERSION: ${{ inputs.chromium_version }}
  GN_ARGS_EXTRA: ${{ inputs.gn_args }}
  # Empty: the image's default Xcode.
  XCODE_VERSION: ""
  # A job may run for 360 minutes. Building stops 300 minutes after the job
  # started, which leaves time to pack and upload the tree.
  BUILD_UNTIL_MINUTE: "300"
  # The number of the last build job below. It fails if the build is still
  # not done; add jobs if that happens.
  LAST_PART: "20"

jobs:
  check:
    name: Is this engine built already?
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Look for its release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/chromium-engine-ci.sh check

  build-01:
    name: Fetch and build 01
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env:
      PART: "01"
      PREVIOUS: ""
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - &clock
        name: Note when the job started
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - &checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # depot_tools supports no newer Python than this.
      - &python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - &prepare
        name: Prepare the runner (Xcode, Metal Toolchain, disk space)
        run: scripts/chromium-engine-ci.sh prepare

      - name: Fetch Chrome, apply OpenArch's layer, configure
        run: scripts/chromium-engine-ci.sh fetch

      - &build
        name: Build
        id: build
        run: scripts/chromium-engine-ci.sh build

      - &distrib
        name: Zip the engine
        if: steps.build.outputs.status == 'finished'
        run: scripts/chromium-engine-ci.sh distrib

      - &upload-distrib
        name: Upload the engine
        if: steps.build.outputs.status == 'finished'
        uses: actions/upload-artifact@v4
        with:
          name: engine-distrib
          path: ${{ runner.temp }}/engine-distrib/
          # Already compressed.
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - &save
        name: Pack the build tree for the next job
        if: steps.build.outputs.status == 'running'
        run: scripts/chromium-engine-ci.sh save

      - &upload-state
        name: Upload the build tree
        if: steps.build.outputs.status == 'running'
        uses: actions/upload-artifact@v4
        with:
          name: engine-state-${{ env.PART }}
          path: ${{ runner.temp }}/engine-state/
          # Already zstd-compressed.
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - &drop-previous
        name: Delete the previous job's build tree
        if: steps.build.outputs.status == 'running' && env.PREVIOUS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/chromium-engine-ci.sh drop-artifacts "engine-state-$PREVIOUS"

      - &out-of-jobs
        name: Give up when no job is left
        if: steps.build.outputs.status == 'running' && env.PART == env.LAST_PART
        run: |
          echo "::error::Not done after $LAST_PART jobs. Add build jobs to this workflow; the tree is in the artifact engine-state-$PART."
          exit 1

  build-02:
    name: Build 02
    needs: build-01
    if: needs.build-01.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env:
      PART: "02"
      PREVIOUS: "01"
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps: &resume
      - *clock
      - *checkout
      - *python
      - *prepare
      - name: Download the previous job's build tree
        uses: actions/download-artifact@v4
        with:
          name: engine-state-${{ env.PREVIOUS }}
          path: ${{ runner.temp }}/engine-state
      - name: Unpack it
        run: scripts/chromium-engine-ci.sh restore
      - *build
      - *distrib
      - *upload-distrib
      - *save
      - *upload-state
      - *drop-previous
      - *out-of-jobs

  # The same as build-02, each one after the one before.
  build-03:
    name: Build 03
    needs: build-02
    if: needs.build-02.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "03", PREVIOUS: "02" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-04:
    name: Build 04
    needs: build-03
    if: needs.build-03.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "04", PREVIOUS: "03" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-05:
    name: Build 05
    needs: build-04
    if: needs.build-04.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "05", PREVIOUS: "04" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-06:
    name: Build 06
    needs: build-05
    if: needs.build-05.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "06", PREVIOUS: "05" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-07:
    name: Build 07
    needs: build-06
    if: needs.build-06.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "07", PREVIOUS: "06" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-08:
    name: Build 08
    needs: build-07
    if: needs.build-07.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "08", PREVIOUS: "07" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-09:
    name: Build 09
    needs: build-08
    if: needs.build-08.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "09", PREVIOUS: "08" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-10:
    name: Build 10
    needs: build-09
    if: needs.build-09.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "10", PREVIOUS: "09" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-11:
    name: Build 11
    needs: build-10
    if: needs.build-10.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "11", PREVIOUS: "10" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-12:
    name: Build 12
    needs: build-11
    if: needs.build-11.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "12", PREVIOUS: "11" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-13:
    name: Build 13
    needs: build-12
    if: needs.build-12.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "13", PREVIOUS: "12" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-14:
    name: Build 14
    needs: build-13
    if: needs.build-13.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "14", PREVIOUS: "13" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-15:
    name: Build 15
    needs: build-14
    if: needs.build-14.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "15", PREVIOUS: "14" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-16:
    name: Build 16
    needs: build-15
    if: needs.build-15.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "16", PREVIOUS: "15" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-17:
    name: Build 17
    needs: build-16
    if: needs.build-16.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "17", PREVIOUS: "16" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-18:
    name: Build 18
    needs: build-17
    if: needs.build-17.outputs.status == 'running'
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    env: { PART: "18", PREVIOUS: "17" }
