name: iOS

on:
  push:
    paths: ["iOS/**", "Shared/**", "relay/relay.js", "relay/test/serve.mjs", ".github/workflows/ios.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The sharing format, crypto and relay client (docs/sharing.md).
  shared:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test the shared package
        run: swift test --package-path Shared

  # OpenArch for iPhone and iPad, built for the simulator (no signing) and
  # put through its self-test there.
  app:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -version
          if ! xcodebuild -project iOS/OpenArch.xcodeproj -scheme OpenArch \
              -destination 'generic/platform=iOS Simulator' -configuration Debug \
              -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            grep -E "error:|fatal" build.log | sort -u | head -100
            tail -40 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "/DerivedData/" | sort -u | head -50 || true
          echo "Build succeeded"

      # Opens a page, pins it into a folder, shares the folder and adds it
      # again, and does the same live against a local relay (SelfTest.swift);
      # the screenshots are kept as an artifact.
      - name: Self-test in the simulator
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          echo "Simulator: $(xcrun simctl list devices | grep "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" build/ios/Build/Products/Debug-iphonesimulator/OpenArch.app
          # relay.js on a plain server: wrangler dev stalled requests here now and then.
          node relay/test/serve.mjs 8787 > relay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8787/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8787/ || { tail -30 relay.log; exit 1; }
          # The app quits when it is done; four minutes at most.
          xcrun simctl launch --console-pty "$udid" at.pfaffenbauer.openarch -selftest -relay http://localhost:8787 > selftest.log 2>&1 &
          pid=$!
          for i in $(seq 1 240); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep -E "\[selftest\]|\[share relay\]" selftest.log || tail -50 selftest.log
          mkdir -p screenshots
          cp -R "$(xcrun simctl get_app_container "$udid" at.pfaffenbauer.openarch data)/Documents/selftest/." screenshots/ || true
          grep -q "DONE failures=0" selftest.log || { tail -30 relay.log; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-selftest-screenshots
          path: screenshots
          retention-days: 7
