# OpenArch for iPhone and iPad: the shared package's tests and the app's
# self-test in the simulator on every push; on main, once both pass, an
# archive with automatic (cloud) signing goes to TestFlight, as in Hackler.
# CFBundleShortVersionString is MARKETING_VERSION from the project,
# CFBundleVersion the run number.
#
# The archive signs with a fixed "Apple Development" certificate imported into
# a temporary keychain. Without it, automatic signing would create a new
# development certificate on every (fresh) runner and the team would hit
# Apple's certificate limit. The same secrets as Hackler's (team 5QAM4Z73EV):
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8 (contents of the .p8)
#                               App Store Connect API key, role Admin so Xcode
#                               may create the distribution certificate and
#                               profiles
#   IOS_CERTIFICATE_P12         base64 of the "Apple Development" .p12
#   IOS_CERTIFICATE_PASSWORD    its password
name: iOS

on:
  push:
    paths: ["iOS/**", "Shared/**", "relay/relay.js", "relay/test/serve.mjs", ".github/workflows/ios.yml"]
  pull_request:
  workflow_dispatch:

# On main a newer push waits instead of cancelling, so no upload to
# TestFlight is cut off halfway.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The sharing format, crypto and relay client (docs/sharing.md).
  shared:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test the shared package
        run: swift test --package-path Shared

  # OpenArch for iPhone and iPad, built for the simulator (no signing) and
  # put through its self-test there.
  app:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -version
          if ! xcodebuild -project iOS/OpenArch.xcodeproj -scheme OpenArch \
              -destination 'generic/platform=iOS Simulator' -configuration Debug \
              -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            grep -E "error:|fatal" build.log | sort -u | head -100
            tail -40 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "/DerivedData/" | sort -u | head -50 || true
          echo "Build succeeded"

      # Opens a page, pins it into a folder, shares the folder and adds it
      # again, and does the same live against a local relay (SelfTest.swift);
      # the screenshots are kept as an artifact.
      - name: Self-test in the simulator
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          echo "Simulator: $(xcrun simctl list devices | grep "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" build/ios/Build/Products/Debug-iphonesimulator/OpenArch.app
          # relay.js on a plain server: wrangler dev stalled requests here now and then.
          node relay/test/serve.mjs 8787 > relay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8787/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8787/ || { tail -30 relay.log; exit 1; }
          # The app quits when it is done; four minutes at most.
          xcrun simctl launch --console-pty "$udid" at.pfaffenbauer.openarch -selftest -relay http://localhost:8787 > selftest.log 2>&1 &
          pid=$!
          for i in $(seq 1 240); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep -E "\[selftest\]|\[share relay\]" selftest.log || tail -50 selftest.log
          mkdir -p screenshots
          cp -R "$(xcrun simctl get_app_container "$udid" at.pfaffenbauer.openarch data)/Documents/selftest/." screenshots/ || true
          grep -q "DONE failures=0" selftest.log || { tail -30 relay.log; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-selftest-screenshots
          path: screenshots
          retention-days: 7

  # Skips the upload (instead of failing) until the secrets are set.
  secrets:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID != '' }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 != '' }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 != '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD != '' }}
        run: |
          if [ "$ASC_API_KEY_ID" = true ] && [ "$ASC_API_ISSUER_ID" = true ] && [ "$ASC_API_KEY_P8" = true ] \
            && [ "$IOS_CERTIFICATE_P12" = true ] && [ "$IOS_CERTIFICATE_PASSWORD" = true ]; then echo ok=true >> "$GITHUB_OUTPUT"; else echo "::notice::TestFlight secrets missing, skipping the upload"; echo ok=false >> "$GITHUB_OUTPUT"; fi

  testflight:
    needs: [shared, app, secrets]
    if: needs.secrets.outputs.ok == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 5QAM4Z73EV
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/asc/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8"
          mkdir -p "$(dirname "$key")"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Signing keychain
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046 # one argument per existing keychain
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc" | grep -q '"Apple Development: ' \
            || { echo "no Apple Development identity in IOS_CERTIFICATE_P12" >&2; exit 1; }
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iOS/OpenArch.xcodeproj -scheme OpenArch -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/OpenArch.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 200
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenArch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_API_ISSUER_ID }}" | tail -n 100
          echo "::notice::OpenArch $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/OpenArch.xcarchive/Info.plist") (${{ github.run_number }}) uploaded to TestFlight"
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"
