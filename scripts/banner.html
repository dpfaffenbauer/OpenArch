<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#fafaf7;font-family:"Instrument Sans",sans-serif;color:#141814;position:relative}
.copy{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.logo{display:flex;align-items:center;gap:16px;margin-bottom:36px}
.logo img{width:72px;height:72px}
.logo span{font-family:"Bricolage Grotesque";font-weight:800;font-size:40px;letter-spacing:-.02em}
h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:64px;line-height:1.02;letter-spacing:-.03em;margin:0 0 24px}
p{font-size:22px;line-height:1.4;color:#4c5650;margin:0 0 28px}
.dots{display:flex;gap:10px;font-size:17px;font-weight:600;color:#4c5650}
.dots span{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e5df;border-radius:999px;padding:7px 14px}
.dots i{width:10px;height:10px;border-radius:50%}
.shot{position:absolute;left:640px;top:70px;width:820px;border-radius:16px;box-shadow:0 30px 80px rgba(20,24,20,.22),0 0 0 1px rgba(20,24,20,.08)}
.glow{position:absolute;left:560px;top:-100px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#e8f5ea 0%,#eaf1fd 45%,rgba(250,250,247,0) 70%)}
</style></head><body>
<div class="glow"></div>
<div class="copy">
  <div class="logo"><img src="../website/assets/icon.png"><span>OpenArch</span></div>
  <h1>Arc closes.<br>OpenArch opens.</h1>
  <p>The sidebar browser you know, rebuilt as open source on real Chrome. For Mac, iPhone and iPad.</p>
  <div class="dots"><span><i style="background:#3e7be6"></i>Spaces</span><span><i style="background:#f08a3c"></i>Split View</span><span><i style="background:#55b860"></i>Extensions</span></div>
</div>
<img class="shot" src="../website/assets/hero.jpg">
</body></html>
