# docs.openarch.app: the built site (dist/) as a Cloudflare Worker that only
# serves files. Cloudflare's GitHub connection (Workers Builds, root directory
# `docs-site`, build command `npm ci && npm run build`, deploy command
# `npx wrangler deploy`) deploys it from main, as it does the relay.
name = "openarch-docs"
compatibility_date = "2026-10-01"
workers_dev = false

# Cloudflare makes the DNS record and the certificate, as for share.openarch.app.
routes = [{ pattern = "docs.openarch.app", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "404-page"
